Name=ASW Find, Fix and Prosecute (Beta)
Description=Airborne ASW automation: pick a sonobuoy pattern (grid, corridor, ring, line), click the map, and aircraft and helicopters drop it efficiently. Share the pattern across several aircraft and the buoys are split by position and speed. Requires Sea Power 0.9.0+ and Anchor Chain 1.2.0 (follow its install steps, including the 1.2.0 preloader): enable both in the Mods menu and restart the game.

